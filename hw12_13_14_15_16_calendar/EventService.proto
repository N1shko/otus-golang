syntax = "proto3";

package internalgrpc;

option go_package = "github.com/N1shko/otus-golang/hw12_13_14_15_calendar/internal/server/grpc/pb";

import "google/protobuf/timestamp.proto";

message Event {
  string id = 1;
  string title = 2;
  google.protobuf.Timestamp date_start = 3;
  google.protobuf.Timestamp date_end = 4;
  string description = 5;
  string user_id = 6;
  google.protobuf.Timestamp send_before = 7;
}

message HelloRequest {
  string name = 1;
}

message HelloResponse {
  string message = 1;
}

service EventService {
  rpc AddEvent(AddEventRequest) returns (AddEventResponse);
  rpc UpdateEvent(UpdateEventRequest) returns (UpdateEventResponse);
  rpc DeleteEvent(DeleteEventRequest) returns (DeleteEventResponse);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc GetEvent(GetEventRequest) returns (GetEventResponse);
  rpc GetEventsByTimeRange(GetEventsByTimeRangeRequest) returns (GetEventsByTimeRangeResponse);
  rpc SayHello (HelloRequest) returns (HelloResponse);
}

message AddEventRequest {
  Event event = 1;
}
message AddEventResponse {}

message UpdateEventRequest {
  Event event = 1;
}
message UpdateEventResponse {}

message DeleteEventRequest {
  string id = 1;
}
message DeleteEventResponse {}

message ListEventsRequest {}
message ListEventsResponse {
  repeated Event events = 1;
}

message GetEventRequest {
  string id = 1;
}
message GetEventResponse {
  Event event = 1;
}


enum TimeRangeType {
  TIME_RANGE_TYPE_UNSPECIFIED = 0;
  DAY = 1;
  WEEK = 2;
  MONTH = 3;
}

message GetEventsByTimeRangeRequest {
  TimeRangeType range_type = 1;
  google.protobuf.Timestamp start_date = 2;
}

message GetEventsByTimeRangeResponse {
  repeated Event events = 1;
}